\* Cap is 2 here (4 in forge) so that 3 exec nodes hit the cap.
CONSTANTS
  GrillNodes  = {g1, g2}
  VerifyNodes = {v1}
  ExecNodes   = {e1, e2, e3}
  Cap         = 2
  MaxFail     = 2
  MaxCycles   = 2

SPECIFICATION Spec

INVARIANTS
  TypeOK
  CapOK
  OnlyCurrentPhaseRuns
  PhaseBarrier
  ExecNeedsApproval
  NoOrphanAgents

PROPERTIES
  ForwardOnly
  Termination
  NoStuckFailure
