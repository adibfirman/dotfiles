\* Cap is 2 here (4 in forge) so that 3 exec nodes hit the cap.
\* RetryCap is 2 here (4 in forge) and MaxFail 3, so a node can be blocked, retried, and fail again.
CONSTANTS
  GrillNodes  = {g1, g2}
  VerifyNodes = {v1}
  ExecNodes   = {e1, e2, e3}
  Cap         = 2
  MaxFail     = 3
  RetryCap    = 2
  MaxCycles   = 2

SPECIFICATION Spec

INVARIANTS
  TypeOK
  CapOK
  OnlyCurrentPhaseRuns
  PhaseBarrier
  ExecNeedsApproval
  NoOrphanAgents

PROPERTIES
  ForwardOnly
  BlockedNeedsUser
  Termination
  NoStuckFailure
